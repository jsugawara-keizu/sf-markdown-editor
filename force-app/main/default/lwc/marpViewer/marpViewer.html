<template>
  <template lwc:if={hasMarp}>
    <div class={rootClass}>
      <!-- view toggle -->
      <div class="marp-toggle-bar">
        <lightning-button-icon
          icon-name={toggleIcon}
          variant="border-filled"
          size="small"
          title={toggleLabel}
          alternative-text={toggleLabel}
          onclick={handleToggle}
        ></lightning-button-icon>
        <span class="marp-toggle-label">{toggleLabel}</span>
        <template lwc:if={isSlideMode}>
          <lightning-button-icon
            icon-name={fullscreenIcon}
            variant="border-filled"
            size="small"
            title={fullscreenLabel}
            alternative-text={fullscreenLabel}
            onclick={handleFullscreen}
          ></lightning-button-icon>
        </template>
      </div>

      <template lwc:if={isSlideMode}>
        <!-- slide wrapper -->
        <div class="marp-slide-wrapper" onkeydown={handleKeydown} tabindex="0">
          <div class="marp-aspect">
            <iframe
              data-id="marp-frame"
              class="marp-frame"
              title="Marp slide viewer"
              sandbox="allow-scripts allow-same-origin"
            ></iframe>
          </div>

          <!-- navigation -->
          <div class="marp-nav" role="navigation">
            <lightning-button-icon
              icon-name="utility:back"
              variant="border-filled"
              size="small"
              disabled={isPrevDisabled}
              alternative-text={label.MarpPrevSlide}
              onclick={handlePrev}
            ></lightning-button-icon>
            <span class="marp-counter" aria-live="polite">{slideCounter}</span>
            <lightning-button-icon
              icon-name="utility:forward"
              variant="border-filled"
              size="small"
              disabled={isNextDisabled}
              alternative-text={label.MarpNextSlide}
              onclick={handleNext}
            ></lightning-button-icon>
          </div>
        </div>
      </template>
      <template lwc:else>
        <c-markdown-viewer value={value}></c-markdown-viewer>
      </template>
    </div>
  </template>
</template>
