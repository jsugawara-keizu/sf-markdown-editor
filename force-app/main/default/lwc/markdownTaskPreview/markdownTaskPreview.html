<template>
  <template lwc:if={showPreview}>
    <div
      class="md-task-preview"
      style={previewStyle}
      onmouseenter={handleMouseEnter}
      onmouseleave={handleMouseLeave}
      onfocusin={handleFocusIn}
      onfocusout={handleFocusOut}
      onkeydown={handleKeyDown}
    >
      <div class="md-task-preview-header">
        <lightning-button-icon
          icon-name="utility:new_window"
          alternative-text={label.openRecord}
          title={label.openRecord}
          variant="bare"
          size="medium"
          onclick={handleOpenRecord}
        ></lightning-button-icon>
        <lightning-button-icon
          icon-name="utility:close"
          alternative-text={label.close}
          title={label.close}
          variant="bare"
          size="medium"
          onclick={handleCloseClick}
        ></lightning-button-icon>
      </div>
      <lightning-record-edit-form
        record-id={hoveredTaskId}
        object-api-name="Task"
        onsuccess={handleEditSuccess}
      >
        <lightning-messages></lightning-messages>
        <lightning-tabset variant="scoped">
          <lightning-tab label={label.detailsTab}>
            <template for:each={previewFields} for:item="f">
              <lightning-input-field
                key={f.apiName}
                field-name={f.apiName}
              ></lightning-input-field>
            </template>
          </lightning-tab>
          <lightning-tab label={label.editTab}>
            <template for:each={editableFieldApiNames} for:item="f">
              <lightning-input-field
                key={f}
                field-name={f}
              ></lightning-input-field>
            </template>
          </lightning-tab>
        </lightning-tabset>
        <lightning-button
          variant="brand"
          type="submit"
          label={label.save}
          class="slds-m-top_small"
        ></lightning-button>
      </lightning-record-edit-form>
    </div>
  </template>
</template>
