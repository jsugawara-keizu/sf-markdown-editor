<template>
  <template lwc:if={fieldHasAccess}>
    <div class="md-viewer-root">
      <template lwc:if={isLoading}>
        <div class="md-loading" role="status" aria-live="polite">
          <lightning-spinner
            alternative-text={labels.loadingAltText}
            size="small"
          ></lightning-spinner>
        </div>
      </template>

      <template lwc:if={hasError}>
        <div class="md-error" role="alert">
          <p>{labels.viewerErrorText}</p>
        </div>
      </template>

      <!-- lwc:dom="manual" — replaceChildren で子ノードを差し替えるため
             LWC の DOM 管理対象から外す。これがないと replaceChildren が
             再レンダーをトリガーし無限ループになる。 -->
      <div
        class="md-content"
        data-id="content"
        lwc:dom="manual"
        aria-label={labels.previewAria}
      ></div>

      <template lwc:if={isImageZoomOpen}>
        <div
          class="md-image-zoom-overlay"
          onclick={handleImageZoomOverlayClick}
          onwheel={handleImageZoomWheel}
          role="presentation"
        >
          <div class="md-image-zoom-toolbar">
            <button
              type="button"
              class="md-image-zoom-btn"
              onclick={handleImageZoomOutClick}
              aria-label={labels.imageZoomOutLabel}
              title={labels.imageZoomOutLabel}
            >
              <lightning-icon
                icon-name="utility:zoomout"
                size="x-small"
                variant="inverse"
              ></lightning-icon>
            </button>
            <button
              type="button"
              class="md-image-zoom-btn"
              onclick={handleImageZoomResetClick}
              aria-label={labels.imageZoomResetLabel}
              title={labels.imageZoomResetLabel}
            >
              <lightning-icon
                icon-name="utility:refresh"
                size="x-small"
                variant="inverse"
              ></lightning-icon>
            </button>
            <button
              type="button"
              class="md-image-zoom-btn"
              onclick={handleImageZoomInClick}
              aria-label={labels.imageZoomInLabel}
              title={labels.imageZoomInLabel}
            >
              <lightning-icon
                icon-name="utility:zoomin"
                size="x-small"
                variant="inverse"
              ></lightning-icon>
            </button>
          </div>
          <button
            type="button"
            class="md-image-zoom-close"
            onclick={handleImageZoomCloseClick}
            aria-label={labels.imageZoomCloseLabel}
            title={labels.imageZoomCloseLabel}
          >
            <lightning-icon
              icon-name="utility:close"
              size="small"
              variant="inverse"
            ></lightning-icon>
          </button>
          <img
            src={zoomedImageSrc}
            alt={zoomedImageAlt}
            class="md-image-zoom-img"
            style={imageZoomStyle}
            onmousedown={handleImageZoomMouseDown}
            ondblclick={handleImageZoomDoubleClick}
          />
        </div>
      </template>
    </div>
  </template>
</template>
