<template>
  <template lwc:if={fieldHasAccess}>
    <div class="md-viewer-root">
      <template lwc:if={isLoading}>
        <div class="md-loading" role="status" aria-live="polite">
          <lightning-spinner
            alternative-text={labels.loadingAltText}
            size="small"
          ></lightning-spinner>
        </div>
      </template>

      <template lwc:if={hasError}>
        <div class="md-error" role="alert">
          <p>{labels.viewerErrorText}</p>
        </div>
      </template>

      <!-- lwc:dom="manual" — replaceChildren で子ノードを差し替えるため
             LWC の DOM 管理対象から外す。これがないと replaceChildren が
             再レンダーをトリガーし無限ループになる。 -->
      <div
        class="md-content"
        data-id="content"
        lwc:dom="manual"
        aria-label={labels.previewAria}
      ></div>

      <template lwc:if={isImageZoomOpen}>
        <div
          class="md-image-zoom-overlay"
          onclick={handleImageZoomOverlayClick}
          role="presentation"
        >
          <button
            type="button"
            class="md-image-zoom-close"
            onclick={handleImageZoomCloseClick}
            aria-label={labels.imageZoomCloseLabel}
            title={labels.imageZoomCloseLabel}
          >
            <lightning-icon
              icon-name="utility:close"
              size="small"
              variant="inverse"
            ></lightning-icon>
          </button>
          <img
            src={zoomedImageSrc}
            alt={zoomedImageAlt}
            class="md-image-zoom-img"
          />
        </div>
      </template>
    </div>
  </template>
</template>
